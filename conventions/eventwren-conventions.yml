idempotency:
  coverage: none
  mechanism: null
  header: null
  note: No Idempotency-Key header or equivalent is documented or declared in the contract. createPost charges the
    balance when the post is queued, so a retried POST can charge twice.
reversibility:
  surfaces:
  - write: createPost
    reversal: deletePost
    reversal_endpoint: DELETE /v1/posts/{id}
    window: null
    grade: documented
    docs: https://eventwren.com/openapi.yml
    note: Deletion takes the post down; no refund of the posting fee is stated for an owner deletion.
  - write: 'createPost (moderation outcome: low-quality rejection)'
    reversal: automatic refund
    window: null
    grade: documented
    docs: https://eventwren.com/pricing/
    quote: If it is rejected as low quality, the fee goes back to your balance.
  - write: 'createPost (moderation outcome: abuse penalty / strike)'
    reversal: appeal by email (no operation)
    window: within 30 days
    grade: verified
    docs: https://eventwren.com/terms/
    quote: You can appeal any rejection, penalty or strike by emailing info@apievangelist.com with the post id within
      30 days.
  - write: createAccount
    reversal: deleteAccount (owner confirms via account_url)
    window: null
    grade: documented
    docs: https://eventwren.com/openapi.yml
  - write: updateAccount
    reversal: owner re-enables auto-recharge on the account page (agent cannot)
    window: null
    grade: documented
    docs: https://eventwren.com/openapi.yml
